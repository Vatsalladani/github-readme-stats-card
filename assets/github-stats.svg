<svg xmlns="http://www.w3.org/2000/svg"
     width="820" height="340" viewBox="0 0 820 340"
     role="img" aria-label="GitHub Developer Timeline for Vatsalladani">

  <title>Vatsalladani · GitHub Developer Timeline</title>

  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#388bfd"/>
      <stop offset="60%"  stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="818" height="338" rx="14"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="818" height="338"
        rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <!-- Top accent line -->
  <rect x="1" y="1" width="818" height="2"
        rx="1" fill="url(#accentGrad)" clip-path="url(#cardClip)"/>

  <!-- ── HEADER ── -->
  <text x="36" y="38"
        fill="#f0f6fc"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="20" font-weight="700">Vatsalladani</text>

  <text x="36" y="57"
        fill="#8b949e"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="12">Developer Timeline</text>

  <!-- project name top-right -->
  <text x="784" y="38" text-anchor="end"
        fill="#6e7681"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="10">github-readme-stats-card</text>

  <!-- ── DIVIDER 1 ── -->
  <line x1="36" y1="70" x2="784" y2="70"
        stroke="#21262d" stroke-width="1"/>

  <!-- ── TIMELINE SECTION ── -->

  <!-- Timeline rail -->
  <line x1="56" y1="122" x2="764" y2="122"
        stroke="#30363d" stroke-width="2"/>

  
    <!-- Year 2024 -->
    <rect x="48" y="105" width="16" height="3" rx="2" fill="#1f6feb"/>
    <circle cx="56" cy="122" r="5" fill="#388bfd" stroke="#0d1117" stroke-width="2"/>
    <text x="56" y="142" text-anchor="middle" fill="#388bfd" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="10" font-weight="700">2024</text>

    <!-- Year 2025 -->
    
    <circle cx="332" cy="122" r="5" fill="#388bfd" stroke="#0d1117" stroke-width="2"/>
    <text x="332" y="142" text-anchor="middle" fill="#388bfd" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="10" font-weight="700">2025</text>

    <!-- Year 2026 -->
    <rect x="600" y="86" width="16" height="22" rx="4" fill="#1f6feb"/>
    <circle cx="608" cy="122" r="5" fill="#388bfd" stroke="#0d1117" stroke-width="2"/>
    <text x="608" y="142" text-anchor="middle" fill="#388bfd" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="10" font-weight="700">2026</text>
  <circle cx="764" cy="122" r="4" fill="#3fb950" stroke="#0d1117" stroke-width="2"/>
    <text x="764" y="142" text-anchor="middle" fill="#3fb950" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="9" font-weight="700">NOW</text>

  <!-- ── DIVIDER 2 ── -->
  <line x1="36" y1="160" x2="784" y2="160"
        stroke="#21262d" stroke-width="1"/>

  <!-- ── PRIMARY STATS (3 Columns with Subtle Vertical Dividers) ── -->

  <!-- Vertical column dividers -->
  <line x1="276" y1="168" x2="276" y2="262" stroke="#21262d" stroke-width="1"/>
  <line x1="536" y1="168" x2="536" y2="262" stroke="#21262d" stroke-width="1"/>

  <!-- Column 1: Total Contributions -->
  <text x="156" y="200" text-anchor="middle"
        fill="#f0f6fc"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="38" font-weight="700">49</text>
  <text x="156" y="228" text-anchor="middle"
        fill="#8b949e"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.5">CONTRIBUTIONS</text>
  <text x="156" y="244" text-anchor="middle"
        fill="#6e7681"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="9">Since Oct 13, 2024</text>

  <!-- Column 2: Current Streak (Circular Green Ring + Blue Flame) -->
  <circle cx="406" cy="193" r="17" fill="none" stroke="#3fb950" stroke-width="2"/>
  <g transform="translate(406, 169)">
    <path d="M 0,-7 C 2,-3.5 4.5,-2 4.5,1.5 C 4.5,4.5 2.5,6.5 0,6.5 C -2.5,6.5 -4.5,4.5 -4.5,1.5 C -4.5,-2 -2,-3.5 0,-7 Z" fill="#388bfd"/>
    <path d="M 0,-3 C 1,-1 2,0 2,1.8 C 2,3.2 1,4 0,4 C -1,4 -2,3.2 -2,1.8 C -2,0 -1,-1 0,-3 Z" fill="#58a6ff"/>
  </g>
  <text x="406" y="199" text-anchor="middle"
        fill="#3fb950"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="18" font-weight="700">7</text>
  <text x="406" y="228" text-anchor="middle"
        fill="#8b949e"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.5">CURRENT STREAK</text>
  <text x="406" y="244" text-anchor="middle"
        fill="#6e7681"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="9">consecutive days</text>
  <text x="406" y="258" text-anchor="middle"
        fill="#3fb950"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="9" font-weight="700">Aug 6 - Aug 12</text>

  <!-- Column 3: Longest Streak -->
  <text x="660" y="200" text-anchor="middle"
        fill="#a371f7"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="38" font-weight="700">7</text>
  <text x="660" y="228" text-anchor="middle"
        fill="#8b949e"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="10" font-weight="700" letter-spacing="0.5">LONGEST STREAK</text>
  <text x="660" y="244" text-anchor="middle"
        fill="#6e7681"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="9">personal best</text>
  <text x="660" y="258" text-anchor="middle"
        fill="#a371f7"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="9" font-weight="700">Aug 6 - Aug 12</text>

  <!-- ── DIVIDER 3 ── -->
  <line x1="36" y1="270" x2="784" y2="270"
        stroke="#21262d" stroke-width="1"/>

  <!-- ── INSIGHTS ROW ── -->

  <!-- Peak Day -->
  <text x="36" y="286"
        fill="#6e7681"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="9" font-weight="700" letter-spacing="0.5">PEAK DAY</text>
  <text x="36" y="303"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="11"><tspan fill="#f0f6fc">Jul 22, 2026</tspan><tspan fill="#6e7681">  ·  </tspan><tspan fill="#a371f7" font-weight="700">14</tspan></text>

  <!-- Top Month -->
  <text x="316" y="286"
        fill="#6e7681"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="9" font-weight="700" letter-spacing="0.5">TOP MONTH</text>
  <text x="316" y="303"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="11"><tspan fill="#f0f6fc">Jul 2026</tspan><tspan fill="#6e7681">  ·  </tspan><tspan fill="#a371f7" font-weight="700">30</tspan></text>

  <!-- First Activity -->
  <text x="596" y="286"
        fill="#6e7681"
        font-family="system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif"
        font-size="9" font-weight="700" letter-spacing="0.5">FIRST ACTIVITY</text>
  <text x="596" y="303"
        fill="#f0f6fc"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="11">Oct 13, 2024</text>

  <!-- ── FOOTER ── -->
  <text x="784" y="325" text-anchor="end"
        fill="#6e7681"
        font-family="ui-monospace,'Cascadia Code',Consolas,monospace"
        font-size="9">github-readme-stats-card · by Vatsalladani</text>

</svg>